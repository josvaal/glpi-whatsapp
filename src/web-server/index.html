<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLPI WhatsApp Bot - Dashboard</title>
  <meta name="description" content="Dashboard de gestión para el bot de WhatsApp integrado con GLPI">
  <meta name="theme-color" content="#020f07">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz@9..40&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Background Colors */
      --bg-primary: #020f07;
      --bg-secondary: #051a0f;
      --bg-card: rgba(22, 150, 148, 0.06);
      --bg-card-hover: rgba(22, 150, 148, 0.1);
      --bg-input: rgba(22, 150, 148, 0.08);
      --bg-input-focus: rgba(22, 150, 148, 0.12);
      --bg-log: rgba(0, 0, 0, 0.3);

      /* Text Colors */
      --text-primary: #d8f9e3;
      --text-secondary: rgba(216, 249, 227, 0.75);
      --text-muted: rgba(216, 249, 227, 0.45);

      /* Brand Colors - Green/Cyan Palette Only */
      --primary: #83ed9f;
      --primary-hover: #65d98a;
      --secondary: #169694;
      --secondary-hover: #1ab5b3;
      --secondary-dark: #0f7a78;

      /* Borders */
      --border-light: rgba(22, 150, 148, 0.15);
      --border: rgba(22, 150, 148, 0.25);
      --border-focus: rgba(131, 237, 159, 0.5);

      /* Functional Colors (States) */
      --success: #83ed9f;
      --success-bg: rgba(131, 237, 159, 0.1);
      --warning: #ffd54f;
      --warning-bg: rgba(255, 213, 79, 0.1);
      --error: #ff6b7a;
      --error-bg: rgba(255, 107, 122, 0.1);

      /* Shadows & Glows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      --glow-primary: rgba(131, 237, 159, 0.25);
      --glow-secondary: rgba(22, 150, 148, 0.2);

      /* Spacing Scale (8px grid) */
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 48px;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-base: 0.2s ease;
      --transition-slow: 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: 
        radial-gradient(1000px 500px at 50% -10%, rgba(22, 150, 148, 0.12), transparent),
        radial-gradient(600px 300px at 85% 10%, rgba(131, 237, 159, 0.06), transparent),
        var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.6;
      padding: var(--space-2);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (min-width: 768px) {
      body {
        padding: var(--space-3);
      }
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Typography */
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--primary);
      text-align: center;
      margin-bottom: var(--space-3);
      text-shadow: 0 0 20px var(--glow-primary);
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 2.25rem;
        margin-bottom: var(--space-4);
      }
      h2 {
        font-size: 1.3rem;
      }
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    @media (min-width: 640px) {
      .header {
        flex-direction: row;
        justify-content: space-between;
      }
    }

    /* Connection Status Badge */
    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-full);
      font-size: 0.875rem;
      color: var(--text-primary);
      backdrop-filter: blur(8px);
    }

    .connection-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--secondary);
      animation: pulse 2s ease-in-out infinite;
    }

    .connection-status.connected .dot {
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .connection-status.disconnected .dot {
      background: var(--error);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-4);
      }
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: var(--space-3);
      backdrop-filter: blur(12px);
      transition: transform var(--transition-slow), box-shadow var(--transition-slow), border-color var(--transition-base);
      box-shadow: var(--shadow-md);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-focus);
      background: var(--bg-card-hover);
    }

    @media (min-width: 768px) {
      .card {
        padding: var(--space-4);
      }
    }

    /* Status Badges */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: var(--space-3);
      border: 1px solid;
      transition: all var(--transition-base);
    }

    .status.connected {
      background: var(--success-bg);
      color: var(--success);
      border-color: rgba(131, 237, 159, 0.3);
      box-shadow: 0 0 12px var(--glow-primary);
    }

    .status.disconnected {
      background: var(--error-bg);
      color: var(--error);
      border-color: rgba(255, 107, 122, 0.3);
    }

    .status.pending {
      background: var(--warning-bg);
      color: var(--warning);
      border-color: rgba(255, 213, 79, 0.3);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .status.connected .status-dot {
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .status.disconnected .status-dot {
      background: var(--error);
    }

    .status.pending .status-dot {
      background: var(--warning);
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    /* QR Container */
    .qr-container {
      text-align: center;
      padding: var(--space-3);
      background: rgba(255, 255, 255, 0.97);
      border-radius: var(--radius-lg);
      margin: var(--space-2) 0;
      box-shadow: var(--shadow-md);
    }

    .qr-container img {
      max-width: 200px;
      height: auto;
      border-radius: var(--radius-sm);
    }

    .qr-container p {
      color: var(--bg-primary);
      margin-top: var(--space-2);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* User Info Card */
    .user-info {
      background: var(--bg-input);
      padding: var(--space-3);
      border-radius: var(--radius-md);
      margin: var(--space-2) 0;
      border: 1px solid var(--border-light);
    }

    .user-info p {
      margin: var(--space-1) 0;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .user-info strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Form Elements */
    .input-group {
      margin: var(--space-3) 0;
    }

    .input-group label {
      display: block;
      margin-bottom: var(--space-2);
      color: var(--text-primary);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all var(--transition-base);
    }

    .input-group input::placeholder {
      color: var(--text-muted);
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--border-focus);
      background: var(--bg-input-focus);
      box-shadow: 0 0 0 3px rgba(131, 237, 159, 0.1);
    }

    .input-group input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
      text-decoration: none;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: var(--bg-primary);
      box-shadow: 0 4px 12px var(--glow-primary);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--glow-primary);
      filter: brightness(1.05);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid rgba(255, 107, 122, 0.3);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(255, 107, 122, 0.15);
      border-color: var(--error);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-small {
      padding: 8px 14px;
      font-size: 0.875rem;
    }

    .btn-group {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-top: var(--space-3);
    }

    @media (max-width: 640px) {
      .btn-group {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }

    /* Alerts */
    .alert {
      padding: 16px 18px;
      border-radius: var(--radius-md);
      margin: var(--space-2) 0;
      border-left: 4px solid;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .alert-warning {
      background: var(--warning-bg);
      border-color: var(--warning);
      color: var(--warning);
    }

    .alert-error {
      background: var(--error-bg);
      border-color: var(--error);
      color: var(--error);
    }

    .alert-success {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    .alert-info {
      background: var(--bg-card);
      border-color: var(--secondary);
      color: var(--text-primary);
    }

    /* Logs Container */
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2);
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .logs-header h2 {
      margin: 0;
    }

    .logs-container {
      background: var(--bg-log);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
      max-height: 320px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      border: 1px solid var(--border-light);
      scrollbar-width: thin;
      scrollbar-color: var(--secondary) transparent;
      scroll-behavior: smooth;
    }

    .logs-container::-webkit-scrollbar {
      width: 8px;
    }

    .logs-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .logs-container::-webkit-scrollbar-thumb {
      background: var(--secondary);
      border-radius: var(--radius-sm);
    }

    .log-entry {
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-secondary);
      transition: color var(--transition-fast);
      word-break: break-word;
    }

    .log-entry:hover {
      color: var(--text-primary);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-entry.error { color: var(--error); }
    .log-entry.success { color: var(--success); }
    .log-entry.info { color: var(--secondary); }

    /* Expires Info */
    .expires-info {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: var(--space-2);
    }

    .expires-info strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Loading Spinner */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border-light);
      border-radius: 50%;
      border-top-color: var(--text-primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Utility Classes */
    .hidden { display: none !important; }

    .last-update {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: var(--space-3);
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: var(--space-3);
      right: var(--space-3);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      max-width: calc(100vw - var(--space-4));
    }

    @media (min-width: 640px) {
      .toast-container {
        max-width: 450px;
      }
    }

    .toast {
      min-width: 280px;
      max-width: 100%;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: toastSlideIn var(--transition-slow);
      color: var(--text-primary);
      font-size: 0.9rem;
      position: relative;
      overflow: hidden;
    }

    @keyframes toastSlideIn {
      from {
        transform: translateX(calc(100% + var(--space-3)));
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast.toast-hide {
      animation: toastSlideOut var(--transition-slow) forwards;
    }

    @keyframes toastSlideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(calc(100% + var(--space-3)));
        opacity: 0;
      }
    }

    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--error); }
    .toast.info { border-left: 4px solid var(--secondary); }
    .toast.warning { border-left: 4px solid var(--warning); }

    .toast-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .toast-message {
      flex: 1;
      word-break: break-word;
    }

    .toast-close {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 4px;
      opacity: 0.6;
      transition: opacity var(--transition-fast);
      flex-shrink: 0;
    }

    .toast-close:hover {
      opacity: 1;
    }

    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--secondary);
      border-radius: 0 0 0 var(--radius-md);
      animation: progress linear forwards;
    }

    .toast.success .toast-progress { background: var(--success); }
    .toast.error .toast-progress { background: var(--error); }
    .toast.info .toast-progress { background: var(--secondary); }
    .toast.warning .toast-progress { background: var(--warning); }

    @keyframes progress {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* Focus styles */
    .btn:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🤖 GLPI WhatsApp Bot</h1>
      <div id="connection-status" class="connection-status disconnected">
        <span class="dot" aria-hidden="true"></span>
        <span id="connection-status-text">Conectando...</span>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="grid">
      <!-- WhatsApp Card -->
      <div class="card" role="region" aria-labelledby="whatsapp-title">
        <h2 id="whatsapp-title">
          <span class="icon" aria-hidden="true">📱</span>
          WhatsApp
        </h2>

        <div id="whatsapp-status" class="status disconnected" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="whatsapp-status-text">Desconectado</span>
        </div>

        <div id="whatsapp-qr-container" class="qr-container hidden" aria-live="polite">
          <div id="whatsapp-qr"></div>
          <p>Escanea este QR con WhatsApp</p>
        </div>

        <div id="whatsapp-user-info" class="user-info hidden" aria-live="polite">
          <p><strong>ID:</strong> <span id="whatsapp-user-id">-</span></p>
          <p><strong>Nombre:</strong> <span id="whatsapp-user-name">-</span></p>
        </div>

        <div id="whatsapp-error" class="alert alert-error hidden" role="alert">
          <span id="whatsapp-error-text"></span>
        </div>

        <div class="btn-group">
          <button id="btn-whatsapp-logout" class="btn btn-danger" type="button" onclick="whatsappLogout()" aria-label="Cerrar sesión de WhatsApp">
            🚪 Cerrar Sesión
          </button>
        </div>
      </div>

      <!-- GLPI Card -->
      <div class="card" role="region" aria-labelledby="glpi-title">
        <h2 id="glpi-title">
          <span class="icon" aria-hidden="true">🎫</span>
          GLPI Session
        </h2>

        <div id="glpi-status" class="status disconnected" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="glpi-status-text">Sin sesión</span>
        </div>

        <div id="glpi-mfa-container" class="input-group hidden">
          <label for="mfa-code">🔐 Código MFA <span aria-hidden="true">(revisa tu correo)</span></label>
          <input
            type="text"
            id="mfa-code"
            placeholder="Ingresa el código de 6 dígitos"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            autocomplete="one-time-code"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-describedby="mfa-help"
            required
          >
          <p id="mfa-help" class="expires-info">El código MFA se envía al correo registrado en GLPI</p>
          <div class="btn-group">
            <button id="btn-submit-mfa" class="btn btn-primary" type="button" onclick="submitMfa()">
              ✅ Enviar Código
            </button>
            <button id="btn-resend-mfa" class="btn btn-secondary" type="button" onclick="resendMfa()">
              📧 Reenviar Código
            </button>
          </div>
        </div>

        <div id="glpi-expires-info" class="expires-info hidden" aria-live="polite">
          <p>📅 Sesión válida hasta: <strong id="glpi-expires-at">-</strong></p>
        </div>

        <div id="glpi-alert-container" role="alert" aria-live="assertive"></div>

        <div class="btn-group">
          <button id="btn-glpi-login" class="btn btn-primary" type="button" onclick="startGlpiLogin()" aria-label="Iniciar sesión en GLPI">
            🔑 Iniciar Login GLPI
          </button>
          <button id="btn-glpi-logout" class="btn btn-danger" type="button" onclick="glpiLogout()" aria-label="Cerrar sesión de GLPI">
            🚪 Cerrar Sesión GLPI
          </button>
          <button id="btn-glpi-verify" class="btn btn-secondary" type="button" onclick="verifyGlpiSession()" aria-label="Verificar sesión de GLPI">
            🔄 Verificar Sesión
          </button>
        </div>
      </div>
    </div>

    <!-- Logs Card -->
    <div class="card" role="region" aria-labelledby="logs-title">
      <div class="logs-header">
        <h2 id="logs-title">
          <span class="icon" aria-hidden="true">📋</span>
          Logs en Tiempo Real
        </h2>
        <button class="btn btn-secondary btn-small" type="button" onclick="clearLogs()" aria-label="Limpiar logs">
          🗑️ Limpiar
        </button>
      </div>
      <div id="logs-container" class="logs-container" role="log" aria-live="polite" aria-relevant="additions">
        <div class="log-entry">Esperando eventos...</div>
      </div>
      <div id="last-update" class="last-update">Última actualización: --:--:--</div>
    </div>
  </div>

  <script>
    // State
    let ws = null;
    let reconnectTimeout = null;
    let heartbeatInterval = null;
    let lastUpdateTime = null;

    // Constants
    const SELECTORS = {
      connectionStatus: 'connection-status',
      connectionStatusText: 'connection-status-text',
      whatsappStatus: 'whatsapp-status',
      whatsappStatusText: 'whatsapp-status-text',
      whatsappQrContainer: 'whatsapp-qr-container',
      whatsappQr: 'whatsapp-qr',
      whatsappUserInfo: 'whatsapp-user-info',
      whatsappUserId: 'whatsapp-user-id',
      whatsappUserName: 'whatsapp-user-name',
      whatsappError: 'whatsapp-error',
      whatsappErrorText: 'whatsapp-error-text',
      glpiStatus: 'glpi-status',
      glpiStatusText: 'glpi-status-text',
      glpiExpiresInfo: 'glpi-expires-info',
      glpiExpiresAt: 'glpi-expires-at',
      glpiAlertContainer: 'glpi-alert-container',
      glpiMfaContainer: 'glpi-mfa-container',
      mfaCode: 'mfa-code',
      logsContainer: 'logs-container',
      lastUpdate: 'last-update',
      toastContainer: 'toast-container',
      btnGlpiLogin: 'btn-glpi-login',
      btnSubmitMfa: 'btn-submit-mfa',
      btnGlpiVerify: 'btn-glpi-verify',
    };

    // Utility Functions
    const $ = (id) => document.getElementById(id);

    const showElement = (id) => $(id)?.classList.remove('hidden');
    const hideElement = (id) => $(id)?.classList.add('hidden');

    const updateLastUpdateTime = () => {
      lastUpdateTime = new Date();
      const el = $(SELECTORS.lastUpdate);
      if (el) {
        el.textContent = `Última actualización: ${lastUpdateTime.toLocaleTimeString()}`;
      }
    };

    const updateConnectionStatus = (connected) => {
      const statusEl = $(SELECTORS.connectionStatus);
      const statusText = $(SELECTORS.connectionStatusText);
      if (statusEl && statusText) {
        statusEl.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
        statusText.textContent = connected ? 'En línea' : 'Desconectado';
      }
    };

    // Toast Notifications
    const showToast = (message, type = 'info', duration = 5000) => {
      const container = $(SELECTORS.toastContainer);
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const icons = {
        success: '✅',
        error: '❌',
        info: 'ℹ️',
        warning: '⚠️'
      };

      toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.info}</span>
        <span class="toast-message">${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()" aria-label="Cerrar notificación">×</button>
        <div class="toast-progress" style="animation-duration: ${duration}ms"></div>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.classList.add('toast-hide');
          setTimeout(() => toast.remove(), 300);
        }
      }, duration);
    };

    // Logs
    const clearLogs = () => {
      const container = $(SELECTORS.logsContainer);
      if (container) {
        container.innerHTML = '<div class="log-entry">Logs limpiados</div>';
      }
      showToast('Logs limpiados', 'info', 2000);
    };

    const addLog = (message, type = null, scroll = true) => {
      const container = $(SELECTORS.logsContainer);
      if (!container) return;

      const entry = document.createElement('div');
      entry.className = 'log-entry';
      if (type) entry.classList.add(type);

      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      container.appendChild(entry);

      if (scroll) {
        container.scrollTop = container.scrollHeight;
      }

      while (container.children.length > 100) {
        container.removeChild(container.firstChild);
      }
    };

    // WebSocket
    const connectWebSocket = () => {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        addLog('✅ Conectado al dashboard', 'success');
        updateConnectionStatus(true);
        showToast('Conectado al dashboard', 'success', 3000);

        heartbeatInterval = setInterval(() => {
          if (ws?.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'ping' }));
          }
        }, 10000);
      };

      ws.onclose = () => {
        if (heartbeatInterval) {
          clearInterval(heartbeatInterval);
          heartbeatInterval = null;
        }
        updateConnectionStatus(false);
        addLog('🔌 Desconectado del dashboard', 'error');
        reconnectTimeout = setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        updateConnectionStatus(false);
        addLog('❌ Error de conexión WebSocket', 'error');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleWebSocketMessage(data);
          updateLastUpdateTime();
        } catch (err) {
          console.error('Error parsing WebSocket message:', err);
          addLog('❌ Error al procesar datos del servidor', 'error');
        }
      };
    };

    const handleWebSocketMessage = (data) => {
      switch (data.type) {
        case 'initial-state':
          updateWhatsAppState(data.whatsapp);
          updateGlpiState(data.glpi);
          data.logs.forEach(log => addLog(log, null, false));
          break;
        case 'whatsapp-state':
          updateWhatsAppState(data.state);
          break;
        case 'whatsapp-qr':
          updateWhatsAppState({ qrCode: data.qrCode, isConnected: false, isConnecting: true, user: null, error: null });
          addLog('📱 Nuevo QR de WhatsApp recibido', 'info');
          break;
        case 'whatsapp-logout':
          updateWhatsAppState(data.state);
          addLog('WhatsApp: Sesión cerrada', 'info');
          break;
        case 'glpi-login-success':
          updateGlpiState(data.status);
          addLog('GLPI: Login completado exitosamente', 'success');
          hideElement(SELECTORS.glpiMfaContainer);
          break;
        case 'glpi-mfa-success':
          updateGlpiState(data.status);
          addLog('GLPI: Código MFA aceptado', 'success');
          hideElement(SELECTORS.glpiMfaContainer);
          break;
        case 'glpi-logout':
          updateGlpiState(data.status);
          addLog('GLPI: Sesión cerrada', 'info');
          break;
        case 'glpi-state-change':
          updateGlpiState(data.status);
          addLog('GLPI: Estado actualizado', 'info');
          break;
        case 'log':
          addLog(data.message, null, false);
          break;
      }
    };

    // State Updates
    const updateWhatsAppState = (state) => {
      const statusEl = $(SELECTORS.whatsappStatus);
      const statusText = $(SELECTORS.whatsappStatusText);
      const qrContainer = $(SELECTORS.whatsappQrContainer);
      const qrDiv = $(SELECTORS.whatsappQr);
      const userInfo = $(SELECTORS.whatsappUserInfo);
      const errorDiv = $(SELECTORS.whatsappError);
      const errorText = $(SELECTORS.whatsappErrorText);

      if (!statusEl || !statusText) return;

      if (state.isConnected) {
        statusEl.className = 'status connected';
        statusText.textContent = 'Conectado';
        hideElement(SELECTORS.whatsappQrContainer);
        showElement(SELECTORS.whatsappUserInfo);
        hideElement(SELECTORS.whatsappError);

        $(SELECTORS.whatsappUserId).textContent = state.user?.id || '-';
        $(SELECTORS.whatsappUserName).textContent = state.user?.name || '-';
      } else if (state.qrCode) {
        statusEl.className = 'status pending';
        statusText.textContent = 'Escanea QR';
        showElement(SELECTORS.whatsappQrContainer);

        // Si el QR es una data URL (comienza con data:image), usarla directamente
        if (state.qrCode.startsWith('data:image')) {
          qrDiv.innerHTML = `<img src="${state.qrCode}" alt="QR Code" style="max-width: 200px; height: auto;">`;
        } else {
          // Si no, usar la API externa para generar el QR
          const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(state.qrCode)}`;
          qrDiv.innerHTML = `<img src="${qrApiUrl}" alt="QR Code">`;
        }
        hideElement(SELECTORS.whatsappUserInfo);
        hideElement(SELECTORS.whatsappError);
      } else {
        statusEl.className = 'status disconnected';
        statusText.textContent = 'Desconectado';
        hideElement(SELECTORS.whatsappQrContainer);
        hideElement(SELECTORS.whatsappUserInfo);

        if (state.error) {
          showElement(SELECTORS.whatsappError);
          errorText.textContent = state.error;
        } else {
          hideElement(SELECTORS.whatsappError);
        }
      }
    };

    const updateGlpiState = (status) => {
      const statusEl = $(SELECTORS.glpiStatus);
      const statusText = $(SELECTORS.glpiStatusText);
      const expiresInfo = $(SELECTORS.glpiExpiresInfo);
      const alertContainer = $(SELECTORS.glpiAlertContainer);

      if (!statusEl || !statusText) return;

      if (status.isValid) {
        statusEl.className = 'status connected';
        statusText.textContent = 'Sesión activa';
        if (expiresInfo) showElement(SELECTORS.glpiExpiresInfo);

        if (status.expiresAt) {
          const expiresAtEl = $(SELECTORS.glpiExpiresAt);
          if (expiresAtEl) {
            expiresAtEl.textContent = new Date(status.expiresAt).toLocaleString();
          }
        }

        if (alertContainer) alertContainer.innerHTML = '';
      } else {
        statusEl.className = 'status disconnected';
        statusText.textContent = 'Sin sesión';
        if (expiresInfo) hideElement(SELECTORS.glpiExpiresInfo);
        if (alertContainer) alertContainer.innerHTML = '';
      }
    };

    // GLPI Actions
    const startGlpiLogin = async () => {
      const btn = $(SELECTORS.btnGlpiLogin);
      if (!btn) return;

      const originalText = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Iniciando...';

      try {
        const response = await fetch('/api/glpi/login-start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        if (result.success && result.step === 'awaiting-mfa') {
          addLog('✅ Login inicial exitoso. Ingresa el código MFA de tu correo.', 'success');
          showToast('Revisa tu correo e ingresa el código MFA de 6 dígitos', 'success', 5000);
          showElement(SELECTORS.glpiMfaContainer);
          setTimeout(() => $(SELECTORS.mfaCode)?.focus(), 100);
        } else if (result.success) {
          addLog('✅ Login GLPI completado', 'success');
          showToast('Sesión de GLPI iniciada exitosamente', 'success', 4000);
        } else {
          const errorMsg = result.error || 'Error en login GLPI';
          addLog(`❌ ${errorMsg}`, 'error');
          showToast(errorMsg, 'error', 5000);
        }
      } catch (err) {
        const errorMsg = err.message || 'Error de conexión. Verifica tu red.';
        addLog(`❌ ${errorMsg}`, 'error');
        showToast(errorMsg, 'error', 5000);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    const submitMfa = async () => {
      const input = $(SELECTORS.mfaCode);
      const btn = $(SELECTORS.btnSubmitMfa);
      const code = input?.value.trim();

      // Validación
      if (!code) {
        showToast('Ingresa el código MFA de 6 dígitos', 'warning', 4000);
        input?.focus();
        return;
      }

      if (!/^\d{6}$/.test(code)) {
        showToast('El código debe tener 6 dígitos numéricos', 'warning', 4000);
        input?.focus();
        input?.select();
        return;
      }

      const originalText = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Enviando...';

      try {
        const response = await fetch('/api/glpi/mfa-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        if (result.success) {
          addLog('✅ Código MFA aceptado', 'success');
          showToast('¡Código MFA aceptado! Sesión iniciada', 'success', 4000);
          if (input) input.value = '';
          hideElement(SELECTORS.glpiMfaContainer);
        } else {
          const errorMsg = result.error || 'Código MFA inválido';
          addLog(`❌ ${errorMsg}`, 'error');
          showToast(errorMsg, 'error', 5000);
          if (input) {
            input.value = '';
            input.focus();
            input.select();
          }
        }
      } catch (err) {
        const errorMsg = err.message || 'Error de conexión. Intenta nuevamente.';
        addLog(`❌ ${errorMsg}`, 'error');
        showToast(errorMsg, 'error', 5000);
        if (input) {
          input.value = '';
          input.focus();
          input.select();
        }
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    const resendMfa = () => {
      addLog('📧 Para reenviar el código MFA, intenta iniciar sesión nuevamente', 'info');
      showToast('GLPI no permite reenviar el código desde la API. Intenta iniciar sesión nuevamente.', 'info', 6000);
    };

    const glpiLogout = async () => {
      if (!confirm('¿Cerrar sesión de GLPI?')) return;

      try {
        const response = await fetch('/api/glpi/logout', { method: 'POST' });

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        addLog('🚪 Sesión de GLPI cerrada', 'info');
        showToast('Sesión de GLPI cerrada', 'info', 3000);
      } catch (err) {
        const errorMsg = err.message || 'Error al cerrar sesión';
        addLog(`❌ ${errorMsg}`, 'error');
        showToast(errorMsg, 'error', 4000);
      }
    };

    const verifyGlpiSession = async () => {
      const btn = $(SELECTORS.btnGlpiVerify);
      if (!btn) return;

      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '🔄 Verificando...';

      try {
        const response = await fetch('/api/glpi/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        if (result.isValid) {
          addLog('✅ Sesión de GLPI válida', 'success');
          showToast('Sesión de GLPI activa y válida', 'success', 3000);
        } else {
          addLog('⚠️ Sesión de GLPI expirada o inválida', 'warning');
          showToast('Sesión expirada. Inicia login nuevamente.', 'warning', 5000);
        }

        updateGlpiState(result);
      } catch (err) {
        const errorMsg = err.message || 'Error de conexión';
        addLog(`❌ ${errorMsg}`, 'error');
        showToast(errorMsg, 'error', 4000);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    // WhatsApp Actions
    const whatsappLogout = async () => {
      if (!confirm('¿Cerrar sesión de WhatsApp? Deberás escanear el QR nuevamente.')) return;

      try {
        const response = await fetch('/api/whatsapp/logout', { method: 'POST' });

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        addLog('🚪 Sesión de WhatsApp cerrada', 'info');
        showToast('Sesión de WhatsApp cerrada', 'info', 3000);
      } catch (err) {
        const errorMsg = err.message || 'Error al cerrar sesión';
        addLog(`❌ ${errorMsg}`, 'error');
        showToast(errorMsg, 'error', 4000);
      }
    };

    // Initialize
    const init = () => {
      connectWebSocket();

      // MFA input Enter key support
      const mfaInput = $(SELECTORS.mfaCode);
      if (mfaInput) {
        mfaInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            submitMfa();
          }
        });

        // Auto-format: only digits
        mfaInput.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Clear error state on input
        mfaInput.addEventListener('focus', () => {
          mfaInput.style.borderColor = '';
        });
      }

      // Polling every 5 seconds
      setInterval(async () => {
        try {
          const response = await fetch('/api/status');
          const data = await response.json();
          updateWhatsAppState(data.whatsapp);
          updateGlpiState(data.glpi);
        } catch (err) {
          console.error('Error polling status:', err);
        }
      }, 5000);
    };

    // Start app
    init();
  </script>
</body>
</html>
